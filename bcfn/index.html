  <title>Redirecting — Mohammad‑Reza</title>

  <style>
    :root{
      --bg1:#0f172a; /* dark navy */
      --bg2:#0b1220;
      --card: rgba(255,255,255,0.04);
      --accent: #6ee7b7; /* minty */
      --muted: rgba(255,255,255,0.6);
      --glass: rgba(255,255,255,0.03);
      --radius:14px;
      --delay:3s;
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', 'Helvetica Neue', Arial;
    }
    html,body{height:100%;}
    body{
      margin:0;
      background:linear-gradient(180deg,var(--bg1),var(--bg2));
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }
    .card{
      width:min(920px,100%);
      background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border-radius:var(--radius);
      box-shadow: 0 6px 30px rgba(2,6,23,0.6);
      padding:28px;
      display:grid;
      grid-template-columns: auto 1fr;
      gap:20px;
      align-items:center;
      backdrop-filter: blur(6px) saturate(120%);
    }
    .logo{
      width:96px;height:96px;border-radius:12px;
      display:flex;align-items:center;justify-content:center;
      background:linear-gradient(135deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
      border:1px solid rgba(255,255,255,0.03);
      font-weight:700;color:var(--accent);
      font-size:20px;
      box-shadow: inset 0 -8px 30px rgba(0,0,0,0.4);
    }
    .content h1{margin:0;font-size:20px;color:#fff}
    .content p{margin:8px 0 0;color:var(--muted);line-height:1.5}

    .actions{
      margin-top:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;
    }
    .btn{
      appearance:none;border:0;padding:10px 14px;border-radius:10px;font-weight:600;
      background:linear-gradient(90deg, rgba(255,255,255,0.03), rgba(255,255,255,0.02));
      color:var(--accent);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.4);
    }
    .btn:focus{outline:2px solid rgba(110,231,183,0.18);outline-offset:2px}

    .secondary{color:var(--muted);font-weight:500;text-decoration:none}

    .status{margin-top:10px;font-size:13px;color:var(--muted);}

    /* progress bar */
    .progress{
      height:8px;background:var(--glass);border-radius:999px;overflow:hidden;margin-top:12px;width:100%;
    }
    .bar{height:100%;width:0%;background:linear-gradient(90deg,var(--accent), #34d399);border-radius:999px;transition:width linear;}

    /* small responsive tweaks */
    @media (max-width:640px){
      .card{grid-template-columns:1fr;padding:20px}
      .logo{justify-self:center}
      .content{text-align:center}
      .actions{justify-content:center}
    }
  </style>
</head>

    <div class="content">
      <h1>در حال هدایت به مقصد ...</h1>
      <p class="status" role="status" aria-live="polite">صفحه به آدرس مشخص‌شده منتقل خواهد شد. در صورت نیاز می‌توانید همین حالا به مقصد بروید.</p>

      <div class="progress" aria-hidden="true" title="redirect progress">
        <div class="bar" id="progressBar"></div>
      </div>

      <div class="actions">
        <a id="manualLink" class="btn" href="#">رفتن به مقصد</a>
        <a id="altLink" class="secondary" href="#">اگر هدایت نشدید، کلیک کنید</a>
      </div>

      <p style="margin-top:8px;font-size:13px;color:var(--muted)">انتظار: <strong id="countdown">3</strong> ثانیه — <span id="destText">https://doi.org/10.1016/j.eswa.2025.128327</span></p>

      <noscript>
        <p style="color:var(--muted);margin-top:10px">جاوااسکریپت غیرفعال است — برای رفتن به مقصد روی لینک زیر کلیک کنید:</p>
        <p><a class="btn" href="https://doi.org/10.1016/j.eswa.2025.128327">رفتن به مقصد</a></p>
      </noscript>
    </div>
  </main>

  <script>
    // === CONFIGURE HERE ===
    const destination = 'https://doi.org/10.1016/j.eswa.2025.128327'; // <-- replace with your target URL
    const DELAY_MS = 3000;                       // <-- time before redirect (milliseconds)
    // ======================

    // Update visible elements
    document.getElementById('manualLink').href = destination;
    document.getElementById('altLink').href = destination;
    document.getElementById('altLink').textContent = 'اگر هدایت نشدید، کلیک کنید';
    document.getElementById('destText').textContent = destination.replace(/^https?:\/\//,'');

    // Create dynamic meta refresh (ensures crawler-friendly fallback if desired)
    (function addMetaRefresh(){
      try{
        const meta = document.createElement('meta');
        meta.httpEquiv = 'refresh';
        meta.content = Math.round(DELAY_MS/1000) + ';url=' + destination;
        document.getElementsByTagName('head')[0].appendChild(meta);
      }catch(e){/* ignore */}
    })();

    // Animate countdown + progress bar
    (function startCountdown(){
      const progress = document.getElementById('progressBar');
      const countdownEl = document.getElementById('countdown');
      const start = Date.now();
      const end = start + DELAY_MS;
      progress.style.transition = `width ${DELAY_MS}ms linear`;
      // force layout so transition works even when setting width immediately
      progress.getBoundingClientRect();
      requestAnimationFrame(()=>{progress.style.width = '100%';});

      const tick = () => {
        const now = Date.now();
        const remaining = Math.max(0, end - now);
        countdownEl.textContent = Math.ceil(remaining / 1000);
        if(remaining <= 0){
          window.location.replace(destination);
          return;
        }
        requestAnimationFrame(tick);
      };
      tick();
    })();

    // Keyboard-friendly: pressing Enter on the primary button will follow link
    document.getElementById('manualLink').addEventListener('keydown', (e)=>{
      if(e.key === 'Enter') window.location.href = destination;
    });
  </script>
