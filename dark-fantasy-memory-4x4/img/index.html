<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Icons — Gallery</title>
  <meta name="description" content="All icons (Icon1.png … Icon50.png) - click to open full size." />
  <style>
    :root{
      --bg:#070708;
      --card:#0f1113;
      --muted:#9aa1a6;
      --accent: #b98f3a;
    }

    html,body{height:100%;}
    body{
      margin:0;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background: linear-gradient(180deg, #030305 0%, #0b0b0d 100%);
      color: #e6e7e8;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:1rem;
      padding:1rem;
    }

    header{
      width:100%;
      max-width:1100px;
      text-align:center;
      margin-bottom:0.25rem;
    }
    h1{
      margin:0;
      font-size:1.05rem;
      letter-spacing:0.02em;
      font-weight:600;
      color: #f5f3ee;
    }
    p.lead{
      margin:0.25rem 0 0.5rem 0;
      color:var(--muted);
      font-size:0.9rem;
    }

    /* Frame that keeps gallery nicely bounded on-screen */
    .frame{
      width: min(95vmin, 1100px);
      max-width: 100%;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), transparent);
      border-radius:12px;
      padding:12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.03);
    }

    /* Responsive grid */
    .gallery{
      display:grid;
      grid-template-columns: repeat(auto-fit, minmax(72px, 1fr));
      gap:10px;
      align-items:stretch;
    }

    /* Card */
    .tile{
      background: linear-gradient(180deg, var(--card), rgba(255,255,255,0.01));
      border-radius:8px;
      padding:8px;
      display:flex;
      align-items:center;
      justify-content:center;
      aspect-ratio:1/1;
      transition: transform 160ms ease, box-shadow 160ms ease;
      border: 1px solid rgba(255,255,255,0.03);
      overflow:hidden;
      text-decoration:none;
      color:inherit;
    }
    .tile:focus,
    .tile:hover{
      transform: translateY(-6px);
      box-shadow: 0 18px 40px rgba(0,0,0,0.6);
      outline: 3px solid rgba(185,143,58,0.08);
    }

    .tile img{
      max-width: 76%;
      max-height: 76%;
      width:auto;
      height:auto;
      image-rendering: crisp-edges;
      image-rendering: pixelated;
      display:block;
      margin:auto;
      filter: drop-shadow(0 6px 18px rgba(0,0,0,0.6));
    }

    /* caption row */
    .meta{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-top:10px;
      font-size:0.82rem;
      color:var(--muted);
    }
    .meta .hint{color:var(--muted);}

    footer{
      font-size:0.78rem;
      color:var(--muted);
      text-align:center;
      max-width:1100px;
    }

    /* Small screens: tighten spacing */
    @media (max-width:420px){
      .gallery{ gap:8px; grid-template-columns: repeat(4, 1fr); }
      .tile img{ max-width: 70%; max-height:70%; }
    }
  </style>
</head>
