<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dark Memory — 4x4</title>
  <link rel="icon" type="image/x-icon" href="favicon.png">

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts (fantasy vibe) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Unbounded:wght@300;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>
<body class="min-h-screen font-sans bg-gradient-to-b from-gray-900 via-gray-950 to-black text-gray-100">

  <main class="container mx-auto px-4 py-10">
    <div class="max-w-4xl mx-auto text-center mb-8">
      <h1 class="text-4xl md:text-5xl font-bold tracking-tight" style="font-family: 'Cinzel', serif;">
        Dark Memory
      </h1>
      <p class="mt-2 text-sm text-gray-400" style="font-family: 'Unbounded', sans-serif;">
        Find all matching pairs. Good luck, mortal.
      </p>
    </div>

    <section 
        class="mx-auto bg-[#0b0b0b]/60 rounded-2xl p-4 shadow-2xl ring-1 ring-black/60"
        style="width: min(90vmin, 720px);"
    >
      <!-- Controls -->
      <div class="flex flex-col md:flex-row items-center justify-between gap-4 mb-6">
        <div class="flex items-center gap-4">
          <div class="text-left">
            <div class="text-xs text-gray-400">Moves</div>
            <div id="moves" class="text-2xl font-semibold">0</div>
          </div>
          <div class="text-left">
            <div class="text-xs text-gray-400">Time</div>
            <div id="timer" class="text-2xl font-semibold">00:00</div>
          </div>
          <div class="text-left hidden md:block">
            <div class="text-xs text-gray-400">Best</div>
            <div id="best" class="text-2xl font-semibold">—</div>
          </div>
        </div>

        <div class="flex items-center gap-3">
          <button id="hintBtn" class="btn-sm btn-muted" title="Reveal unmatched briefly">Hint</button>
          <button id="restartBtn" class="btn-sm btn-primary">Restart</button>
        </div>
      </div>

      <!-- Grid -->
      <div id="board" class="grid grid-cols-4 gap-4">
        <!-- Cards injected by JS -->
      </div>
    </section>
  </main>

  <script src="main.js" defer></script>
</body>
</html>
