<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Chaos Theory — 3-view Visualization</title>
  <link type="image/png" rel="icon" href="icon-butterfly.png">
  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">

    <div id="canvases">
      <canvas id="c0"></canvas>
      <canvas id="c1"></canvas>
      <canvas id="c2"></canvas>
    </div>

    <!-- Header / Title -->
    <div class="header">
      <div class="text-white font-semibold text-lg">Chaos Visualizer</div>
      <div class="small-hint">Lorenz attractor</div>
    </div>

    <!-- UI Panel -->
    <div id="ui" class="ui">
      <div class="ui-card p-4 rounded-xl shadow-lg">
        <div class="flex items-center justify-between mb-2">
          <div class="text-white font-medium">Controls</div>
          <div class="flex items-center gap-2">
            <button id="pinBtn" class="pin btn" title="Pin controls">📌</button>
            <button id="toggleUI" class="btn" title="Hide/Show">Hide</button>
          </div>
        </div>

        <div class="mt-2 text-white text-sm">Particles: <span id="pcnt">800</span></div>
        <input id="particles" type="range" min="100" max="3000" value="800" class="w-full" />

        <div class="mt-2 text-white text-sm">Speed: <span id="speedv">1</span>x</div>
        <input id="speed" type="range" min="0.2" max="3" step="0.1" value="1" class="w-full" />

        <div class="mt-2 text-white text-sm">Trail fade (0-1): <span id="fadev">0.07</span></div>
        <input id="fade" type="range" min="0.01" max="0.2" step="0.01" value="0.07" class="w-full" />

        <div class="mt-3 flex gap-2">
          <button id="btnToggle" class="btn">Pause</button>
          <button id="btnReset" class="btn">Reset</button>
          <button id="btnExport" class="btn">Export PNG</button>
        </div>

      </div>
    </div>

    <!-- Floating popup for minimal info -->
    <div class="popup">
      <div class="ui-card p-3 rounded-lg shadow-md text-white text-sm">
        <div class="text-white/70 text-xs mt-1"> Made with ❤️ </div>
      </div>
    </div>

  </div>

<script src="main.js"></script>
</body>
</html>
